name: tests

on: [push, pull_request]

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Batteries moteur (v1.0 non-régression + v1.1/v1.2)
        run: python test_occulteur.py && python test_confesseur.py
      - name: Couche API
        run: python test_occulteur_api.py
      - name: Déterminisme — la vitrine doit tourner
        run: python examples.py > /dev/null
